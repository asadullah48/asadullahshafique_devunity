<rect x="340" y="384" width="130" height="76" rx="10" fill="#0D0620"/>
<text x="405" y="418" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">LIVE</text>
<text x="405" y="440" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#C4B5FD" text-anchor="middle">Production</text>

<rect x="490" y="384" width="150" height="76" rx="10" fill="#0D0620"/>
<text x="565" y="418" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">AI</text>
<text x="565" y="440" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#C4B5FD" text-anchor="middle">Powered Answers</text>

