<text x="88" y="527" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#C4B5FD" text-anchor="middle">Q&amp;A Forum</text>

<rect x="148" y="508" width="68" height="28" rx="14" fill="#1A0B2E"/>
<text x="182" y="527" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#C4B5FD" text-anchor="middle">Blogs</text>

<rect x="228" y="508" width="84" height="28" rx="14" fill="#1A0B2E"/>
<text x="270" y="527" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#C4B5FD" text-anchor="middle">Projects</text>

<rect x="324" y="508" width="104" height="28" rx="14" fill="#1A0B2E"/>
<text x="376" y="527" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#C4B5FD" text-anchor="middle">Hackathons</text>

<rect x="440" y="508" width="80" height="28" rx="14" fill="#1A0B2E"/>
<text x="480" y="527" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#C4B5FD" text-anchor="middle">Discord</text>

<rect x="532" y="508" width="80" height="28" rx="14" fill="#1A0B2E"/>
<text x="572" y="527" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#C4B5FD" text-anchor="middle">AI Chat</text>

