<line x1="40" y1="558" x2="640" y2="558" stroke="#7c3aed" stroke-width="0.5"/>

<!-- Tech stack micro-row -->
<text x="40" y="582" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#C4B5FD">Next.js 15  ·  TypeScript  ·  Tailwind CSS  ·  shadcn/ui  ·  PostgreSQL</text>

<!-- CTA pill -->
<rect x="40" y="598" width="480" height="44" rx="22" fill="#a855f7"/>
<text x="280" y="625" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">asadullahshafique-devunity.vercel.app</text>

