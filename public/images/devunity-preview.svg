<text x="64" y="340" font-family="system-ui, sans-serif" font-size="13" font-weight="400" fill="#C4B5FD">Context-aware for Pakistani devs</text>

<!-- Blog & Collab Card -->
<rect x="356" y="216" width="284" height="148" rx="12" fill="#0E061A"/>
<rect x="356" y="216" width="284" height="148" rx="12" fill="none" stroke="#7c3aed" stroke-width="0.5"/>
<text x="380" y="252" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#C4B5FD" letter-spacing="1.5">KNOWLEDGE  BASE</text>
<text x="380" y="278" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">Blogs &amp; Projects</text>
<text x="380" y="300" font-family="system-ui, sans-serif" font-size="13" font-weight="400" fill="#C4B5FD">Write &amp; share technical guides</text>
<text x="380" y="320" font-family="system-ui, sans-serif" font-size="13" font-weight="400" fill="#C4B5FD">Showcase open-source projects</text>
<text x="380" y="340" font-family="system-ui, sans-serif" font-size="13" font-weight="400" fill="#C4B5FD">Collaborate &amp; build together</text>

