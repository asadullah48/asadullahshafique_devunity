<svg width="100%" viewBox="0 0 680 680" role="img" xmlns="http://www.w3.org/2000/svg">
<title>DevUnity Platform — Open-Source Developer Community Hub</title>
<desc>A bold banner for DevUnity showing the platform name, tagline, Q&amp;A and blog features, tech stack, and live demo link.</desc>

<!-- Background: deep purple-black -->
<rect width="680" height="680" fill="#0B0714"/>

<!-- Corner accent circles -->
<circle cx="0" cy="0" r="220" fill="none" stroke="#7c3aed" stroke-width="0.5" opacity="0.35"/>
<circle cx="0" cy="0" r="320" fill="none" stroke="#7c3aed" stroke-width="0.5" opacity="0.2"/>
<circle cx="680" cy="680" r="220" fill="none" stroke="#7c3aed" stroke-width="0.5" opacity="0.35"/>
<circle cx="680" cy="680" r="320" fill="none" stroke="#7c3aed" stroke-width="0.5" opacity="0.2"/>

<!-- Decorative code glyphs -->
<text x="572" y="88" font-family="monospace" font-size="72" fill="#a855f7" opacity="0.06">{}</text>
<text x="22" y="628" font-family="monospace" font-size="64" fill="#a855f7" opacity="0.06">&lt;/&gt;</text>

<!-- Top accent bar -->
<rect x="40" y="44" width="80" height="4" rx="2" fill="#a855f7"/>

<!-- Brand name -->
<text x="40" y="100" font-family="system-ui, sans-serif" font-size="52" font-weight="700" fill="#FFFFFF" letter-spacing="-1">DevUnity</text>

<!-- Urdu / Arabic subtle label -->
