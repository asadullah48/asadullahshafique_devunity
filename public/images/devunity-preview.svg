<text x="105" y="418" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">100%</text>
<text x="105" y="440" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#C4B5FD" text-anchor="middle">Open Source</text>

