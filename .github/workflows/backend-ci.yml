# Backend CI/CD
# ==============
# - Runs on push to main and pull requests
# - Lints, type-checks, and tests the FastAPI backend
# - Builds and pushes Docker image on main branch push

name: Backend CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'

env:
  PYTHON_VERSION: '3.12'
  REGISTRY: docker.io/asadullah48

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          
      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy pytest pytest-asyncio httpx
          
      - name: Lint with Ruff
        working-directory: ./backend
        run: |
          ruff check . --output-format=github
          
      - name: Type check with MyPy
        working-directory: ./backend
        run: |
          mypy . --ignore-missing-imports || true
          
      # NOTE: `|| echo` means this step can NEVER fail the build. 8 tests fail on
      # a clean tree today, so tightening it is a separate, deliberate change —
      # but be aware that a green badge here does not mean green tests.
      - name: Run tests
        working-directory: ./backend
        run: |
          pytest -v || echo "No tests found, skipping..."

      # Agent quality gate (CLAUDE.md Rule 4). Unlike the step above, this one
      # CAN fail the build — but only when a model key exists to measure with.
      # With no key it emits a visible warning and exits 0, rather than
      # reporting a green run that measured nothing.
      - name: Run agent evals
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ORCHESTRATOR_MODEL: ${{ vars.ORCHESTRATOR_MODEL }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY$OPENAI_API_KEY$GEMINI_API_KEY" ]; then
            echo "::warning title=Agent evals skipped::No model key configured. Agent quality was NOT measured."
            exit 0
          fi
          pip install -r backend/requirements.txt
          # --delay paces requests; free-tier providers rate-limit per minute and
          # an unpaced burst gets scored as agent failures.
          python evals/run.py --strict --delay 6 --report eval-report.json

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: eval-report.json
          if-no-files-found: ignore

      # Agent quality gate (CLAUDE.md Rule 4). Unlike the step above, this one
      # can actually fail the build — but only when a model key exists to
      # measure with. With no key it emits a visible warning and exits 0 rather
      # than reporting a green run that measured nothing.
      - name: Run agent evals
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ORCHESTRATOR_MODEL: ${{ vars.ORCHESTRATOR_MODEL }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY$OPENAI_API_KEY$GEMINI_API_KEY" ]; then
            echo "::warning title=Agent evals skipped::No model key configured. Agent quality was NOT measured."
            exit 0
          fi
          pip install -r backend/requirements.txt
          # --delay paces requests; free-tier providers rate-limit per minute and
          # unpaced bursts get scored as agent failures.
          python evals/run.py --strict --delay 6 --report eval-report.json

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: eval-report.json
          if-no-files-found: ignore

  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [lint-and-test]
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/portfolio-backend
          tags: |
            type=sha,prefix=
            type=raw,value=latest
            
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-huggingface:
    name: Deploy to Hugging Face Spaces
    runs-on: ubuntu-latest
    needs: [build-docker]
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Configure Git
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          
      - name: Deploy to Hugging Face Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_ID: ${{ secrets.HF_SPACE_ID }}
        run: |
          # Clone the HF Spaces repository
          git clone https://huggingface.co/spaces/$HF_SPACE_ID hf-space
          cd hf-space
          
          # Copy backend files
          cp -r ../backend/* .
          cp ../backend/Dockerfile .
          cp ../backend/requirements.txt .
          
          # Commit and push
          git add .
          git commit -m "Deploy from GitHub: ${{ github.sha }}" || echo "No changes to commit"
          git push https://$HF_TOKEN@huggingface.co/spaces/$HF_SPACE_ID main
